<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - SkillSwap</title>

    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

<nav class="navbar">

    <div class="logo-section">

        <div class="logo-icon">
            🚀
        </div>

        <h1>SkillSwap</h1>
    </div>

    <button class="menu-toggle" id="menuToggle">
                ☰
    </button>

    <div class="nav-links" id="navLinks">

        <a href="perfil.html">
            Mi Perfil
        </a>

        <a href="explorar.html">
            Explorar
        </a>

        <a href="#">
            Intercambios
        </a>

    </div>

    <div class="user-menu">

        <img
            id="miniAvatar"
            src="https://via.placeholder.com/40"
            class="mini-avatar"
        >

    </div>

</nav>

<div class="dashboard">

    <div class="avatar-container">

    <img
        id="fotoPerfil"
        src="https://via.placeholder.com/150"
        class="avatar"
    >

    <label
        for="fotoInput"
        class="upload-btn">
        📷
    </label>

    <input
        type="file"
        id="fotoInput"
        accept="image/*"
        hidden
    >

    </div>

    <h2 id="nombreUsuario"></h2>

    <p id="correoUsuario"></p>

    <div class="stats-grid">

        <div class="stat-card">
            <h3>🚀 Habilidades</h3>
            <span id="totalSkills">0</span>
        </div>

        <div class="stat-card">
            <h3>🎯 Aprendiendo</h3>
            <span id="totalAprender">0</span>
        </div>

        <div class="stat-card">
            <h3>📬 Solicitudes</h3>
            <span id="totalSolicitudes">0</span>
        </div>

    </div>

    <div class="section">

        <h3>Mi Biografía</h3>

        <textarea
            id="bio"
            placeholder="Cuéntanos quién eres..."
        ></textarea>

    </div>

    <div class="section">

        <h3>🚀 Puedo enseñar</h3>

        <div class="input-row">

            <input
                type="text"
                id="habilidadEnsenar"
                placeholder="Agregar habilidad"
            >

            <button
            onclick="agregarHabilidadEnsenar()">
                +
            </button>

        </div>

        <div
            id="listaEnsenar"
            class="skills-container">
        </div>

    </div>

    <div class="section">

        <h3>🎯 Quiero aprender</h3>

        <div class="input-row">

            <input
                type="text"
                id="habilidadAprender"
                placeholder="Agregar habilidad"
            >

            <button
            onclick="agregarHabilidadAprender()">
                +
            </button>

        </div>

        <div
            id="listaAprender"
            class="skills-container">
        </div>

    </div>

    <div class="section">

        <h3>🏆 Insignias</h3>

        <div class="badges">

            <span class="badge">
                Perfil Completo
            </span>

            <span class="badge">
                Primer Usuario
            </span>

        </div>

    </div>

    <div class="section">

        <h3>📬 Solicitudes Recibidas</h3>

        <div id="solicitudesRecibidas"></div>

    </div>

    <button
        class="save-btn"
        onclick="guardarPerfil()">
        Guardar Perfil
    </button>

    <button
        class="logout-btn"
        onclick="cerrarSesion()">
        Cerrar Sesión
    </button>

</div>

<script src="js/perfil.js"></script>

</body>
</html>
